<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>HFQ Delivery Capture</title><link rel="manifest" href="manifest.json">
<style>

<div class="top"><div class="brand"><img src="icons/hfq-logo.png" onerror="this.style.display='none'"><div><h1>Delivery Capture</h1><p>Scan. Capture. Deliver.</p></div></div><div class="bar"><span class="pill">User Mode</span><span class="pill">Offline ready</span><span class="pill">SA Time</span><span class="pill">v31 Sheet First Sync</span></div></div>
<div class="wrap"><div id="msg"></div><main id="view"></main></div><nav class="tabs"><button id="tabAdd" onclick="show('add')">Add</button><button id="tabEntries" onclick="show('entries')">Entries</button><button id="tabSync" onclick="show('sync')">Sync</button></nav>
<script>
(function(){'use strict';
var HARD_CODED_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxm2BBf8L1jkU-moYJsg8UzH8H9KuqFzi7FEZkn6zUJdkQGLdd3PonYis3kaGq4gy8Q/exec',busy=false,scannerStream=null,MAX_UNSYNCED_ENTRIES=8;
var state={tab:'add',adminUnlocked:false,adminCode:'',customers:[],materials:[],sections:[],sites:[],orders:[],trucks:[],entries:[],queue:[],currentTruck:null,photoData:'',lastForm:{site:'',customer:'',material:'',unit:'',section:''},lastMasterSyncAt:''};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function nowSA(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Africa/Johannesburg',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()).replace(' ','T')}function uid(){return 'DEL-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}var DB_NAME='hfqDeliveryIndexedV1',DB_VERSION=1,idbReady=false,idbLoadDone=false;
function makeSmallStorageState(){
 var s=JSON.parse(JSON.stringify(state||{}));
 s.entries=[];
 s.queue=(s.queue||[]).map(function(q){
   var c=JSON.parse(JSON.stringify(q||{}));
   if(c.payload){
     c.payload=JSON.parse(JSON.stringify(c.payload));
     if(c.payload.photoData)c.payload.photoData='[PHOTO_STORED_IN_INDEXEDDB]';
   }
   return c;
 });
 s.photoData=state.photoData?'[PHOTO_STORED_IN_INDEXEDDB]':'';
 s.indexedDbMode=true;
 s.indexedDbUpdatedAt=nowSA();
 return s;
}
function openDb(){
 return new Promise(function(resolve,reject){
   if(!('indexedDB' in window)){reject(new Error('IndexedDB not available on this device/browser'));return;}
   var req=indexedDB.open(DB_NAME,DB_VERSION);
   req.onupgradeneeded=function(ev){
     var db=ev.target.result;
     if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv',{keyPath:'key'});
   };
   req.onsuccess=function(){idbReady=true;resolve(req.result)};
   req.onerror=function(){reject(req.error||new Error('IndexedDB open failed'))};
 });
}
function idbSet(key,value){
 return openDb().then(function(db){return new Promise(function(resolve,reject){
   var tx=db.transaction('kv','readwrite');
   tx.objectStore('kv').put({key:key,value:value,updatedAt:nowSA()});
   tx.oncomplete=function(){db.close();resolve()};
   tx.onerror=function(){db.close();reject(tx.error||new Error('IndexedDB save failed'))};
 })});
}
function idbGet(key){
 return openDb().then(function(db){return new Promise(function(resolve,reject){
   var tx=db.transaction('kv','readonly'),req=tx.objectStore('kv').get(key);
   req.onsuccess=function(){resolve(req.result?req.result.value:null)};
   req.onerror=function(){reject(req.error||new Error('IndexedDB read failed'))};
   tx.oncomplete=function(){db.close()};
 })});
}
function idbSaveBigParts(){
 var entries=JSON.parse(JSON.stringify(state.entries||[]));
 var queue=JSON.parse(JSON.stringify(state.queue||[]));
 var photoData=state.photoData||'';
 return Promise.all([idbSet('entries',entries),idbSet('queue',queue),idbSet('photoData',photoData),idbSet('migratedAt',nowSA())]);
}
function save(){
 try{localStorage.setItem('hfqDeliveryStateV1',JSON.stringify(makeSmallStorageState()));}
 catch(e){try{localStorage.setItem('hfqDeliveryStateV1',JSON.stringify({tab:state.tab,lastMasterSyncAt:state.lastMasterSyncAt,lastForm:state.lastForm,draft:state.draft,indexedDbMode:true,indexedDbUpdatedAt:nowSA()}));}catch(err){}}
 idbSaveBigParts().catch(function(e){try{console.warn('IndexedDB save failed',e)}catch(_){}});
}
function load(){
 var oldRaw='';
 try{oldRaw=localStorage.getItem('hfqDeliveryStateV1')||'';if(oldRaw)Object.assign(state,JSON.parse(oldRaw));}catch(e){}
 if(!Array.isArray(state.entries))state.entries=[];
 if(!Array.isArray(state.queue))state.queue=[];
 if(!state.photoData||state.photoData==='[PHOTO_STORED_IN_INDEXEDDB]')state.photoData='';
 var oldState=null;try{oldState=oldRaw?JSON.parse(oldRaw):null;}catch(e){}
 openDb().then(function(){
   return Promise.all([idbGet('entries'),idbGet('queue'),idbGet('photoData')]);
 }).then(function(parts){
   var dbEntries=parts[0],dbQueue=parts[1],dbPhoto=parts[2];
   var oldHasBig=oldState&&((oldState.entries&&oldState.entries.length)||(oldState.queue&&oldState.queue.length)||oldState.photoData);
   if(Array.isArray(dbEntries)&&dbEntries.length)state.entries=dbEntries;
   else if(oldState&&Array.isArray(oldState.entries))state.entries=oldState.entries;
   if(Array.isArray(dbQueue)&&dbQueue.length)state.queue=dbQueue;
   else if(oldState&&Array.isArray(oldState.queue))state.queue=oldState.queue;
   if(dbPhoto&&dbPhoto!=='[PHOTO_STORED_IN_INDEXEDDB]')state.photoData=dbPhoto;
   else if(oldState&&oldState.photoData&&oldState.photoData!=='[PHOTO_STORED_IN_INDEXEDDB]')state.photoData=oldState.photoData;
   idbLoadDone=true;
   if(oldHasBig)idbSaveBigParts();
   save();
   render();
   if(oldHasBig)msg('Local data migrated to IndexedDB on this device. Google Sheets and Drive were not changed.','ok');
 }).catch(function(e){
   idbLoadDone=true;
   msg('IndexedDB could not open, using fallback local storage. Queue may be less stable: '+(e&&e.message?e.message:e),'error');
   render();
 });
}
function hydrateQueueForSync(){
 return idbGet('queue').then(function(q){
   if(Array.isArray(q)&&q.length){state.queue=q;return q;}
   return state.queue||[];
 }).catch(function(){return state.queue||[]});
}
function msg(t,cls){$('msg').innerHTML=t?'<div class="'+(cls||'ok')+'">'+esc(t)+'</div>':''}
function formMsg(t,cls){
 var el=document.getElementById('formMsg');
 if(el) el.innerHTML=t?'<div class="'+(cls||'ok')+'">'+esc(t)+'</div>':'';
 else msg(t,cls);
}
function captureDeliveryForm(){
 state.draft=state.draft||{};
 var ids=['site','customer','material','qty','unit','section','notes'];
 ids.forEach(function(id){var el=document.getElementById(id); if(el) state.draft[id]=el.value;});
 return state.draft;
}
function restoreDraftVal(id, fallback){
 return (state.draft && state.draft[id] != null) ? state.draft[id] : (fallback || '');
}
function mustSyncFirst(){
 return (state.queue||[]).length >= MAX_UNSYNCED_ENTRIES;
}
function syncLimitMessage(){
 return 'You have '+(state.queue||[]).length+' unsynced entries. Please Sync Queue before adding more entries.';
}

function resizeImageFile(file, cb){
 var reader=new FileReader();
 reader.onload=function(ev){
   var img=new Image();
   img.onload=function(){
     var max=900;
     var w=img.width,h=img.height;
     if(w>h && w>max){h=Math.round(h*max/w);w=max}
     else if(h>=w && h>max){w=Math.round(w*max/h);h=max}
     var canvas=document.createElement('canvas');
     canvas.width=w;canvas.height=h;
     var ctx=canvas.getContext('2d');
     ctx.drawImage(img,0,0,w,h);
     cb(canvas.toDataURL('image/jpeg',0.68));
   };
   img.onerror=function(){cb(ev.target.result)};
   img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
}

function markMissed(ids){
 var missing=[];
 ids.forEach(function(id){
   var el=document.getElementById(id);
   if(el){
     var bad=!String(el.value||'').trim();
     el.classList.toggle('missed',bad);
     if(bad)missing.push(id);
     el.oninput=function(){el.classList.remove('missed');captureDeliveryForm();};
     el.onchange=function(){el.classList.remove('missed');captureDeliveryForm(); if(id==='customer'){state.draft.site='';state.draft.material='';state.draft.unit='';} if(id==='site'){state.draft.material='';state.draft.unit='';} if(id==='material'){state.draft.unit='';} if(['site','customer','material','unit'].indexOf(id)>=0)renderAdd();};
   }
 });
 return missing;
}

window.removePhoto=function(){
 state.photoData='';
 save();
 formMsg('Photo removed.','ok');
 renderAdd();
}

function bindDraftEvents(){
 ['site','customer','material','qty','unit','section','notes'].forEach(function(id){
   var el=document.getElementById(id);
   if(el){
     el.oninput=function(){el.classList.remove('missed');captureDeliveryForm();};
     el.onchange=function(){el.classList.remove('missed');captureDeliveryForm(); if(['site','customer','material','unit'].indexOf(id)>=0)renderAdd();};
   }
 });
}
function setBusy(on,label){
 busy=!!on;
 Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){b.disabled=busy});
 var sb=document.getElementById('saveDeliveryBtn');
 if(sb)sb.textContent=busy?'Saving...':'Save Entry / Queue';
 if(label)msg(label,'ok');
}function markMissed(ids){
var miss=[];
ids.forEach(function(id){
 var el=$(id);
 if(el){
   var bad=!String(el.value||'').trim();
   if(bad){el.classList.add('missed');miss.push(id)}
   else{el.classList.remove('missed')}
   el.oninput=function(){if(String(el.value||'').trim())el.classList.remove('missed');captureDeliveryForm();};
   el.onchange=function(){if(String(el.value||'').trim())el.classList.remove('missed');captureDeliveryForm(); if(id==='customer'){state.draft.site='';state.draft.material='';state.draft.unit='';} if(id==='site'){state.draft.material='';state.draft.unit='';} if(id==='material'){state.draft.unit='';} if(['site','customer','material','unit'].indexOf(id)>=0)renderAdd();};
 }
});
return miss
}function options(arr,val,ph){return '<option value="">'+esc(ph||'Select')+'</option>'+arr.map(function(x){return '<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>'}).join('')}
function uniqSorted(arr){var seen={},out=[];(arr||[]).forEach(function(v){v=String(v||'').trim();if(v&&!seen[v.toUpperCase()]){seen[v.toUpperCase()]=true;out.push(v)}});return out.sort()}
function orderMatchesFilter(o,filter){filter=filter||{};return (!filter.customer||String(o.customer||'')===String(filter.customer))&&(!filter.site||String(o.site||'')===String(filter.site))&&(!filter.material||String(o.material||'')===String(filter.material))&&(!filter.unit||String(o.unit||'')===String(filter.unit))}
function activeOrders(){return (state.orders||[]).filter(function(o){return qtyLeftForOrder(o)>0})}
function activeOrderValues(field,filter){var vals=activeOrders().filter(function(o){return orderMatchesFilter(o,filter)}).map(function(o){return o[field]});return uniqSorted(vals)}
function selectedVal(id,lastKey){var l=state.lastForm||{};return restoreDraftVal(id,l[lastKey||id]||'')}
function availableCustomers(){return activeOrderValues('customer',{})}
function availableSites(){return activeOrderValues('site',{customer:selectedVal('customer','customer')})}
function availableMaterials(){return activeOrderValues('material',{customer:selectedVal('customer','customer'),site:selectedVal('site','site')})}
function availableUnits(){return activeOrderValues('unit',{customer:selectedVal('customer','customer'),site:selectedVal('site','site'),material:selectedVal('material','material')})}

window.show=function(tab){stopScanner();if(tab==='admin')tab='add';state.tab=tab;msg('');render()};window.openAdmin=function(){var code=prompt('Enter admin code from Google Sheets');if(code===null)return;msg('Checking admin code with Google Sheets...','ok');api({action:'verifyAdmin',adminCode:code}).then(function(res){if(!res.ok)throw new Error(res.error||'Wrong admin code');state.adminUnlocked=true;state.adminCode=code;state.tab='admin';save();render();msg('Admin section unlocked.','ok')}).catch(function(e){state.adminUnlocked=false;state.adminCode='';save();msg('Wrong admin code or Google Sheets unavailable: '+e.message,'error')})};function setTabs(){['Add','Entries','Sync'].forEach(function(x){var b=$('tab'+x);if(b)b.className=state.tab.toLowerCase()===x.toLowerCase()?'active':''})}function render(){setTabs(); if(state.tab==='add')renderAdd(); if(state.tab==='entries')renderEntries(); if(state.tab==='sync')renderSync();}

function cleanText(v){return String(v||'').trim()}
function addUnique(arr,v){v=cleanText(v);if(!v)return; if(arr.indexOf(v)<0)arr.push(v)}
function orderId(o){return [o.customer,o.site,o.material,o.unit].map(function(x){return String(x||'').toUpperCase()}).join('|')}
function entryQtyForOrder(o){return (state.entries||[]).filter(function(e){return String(e.customer||'').toUpperCase()===String(o.customer||'').toUpperCase()&&String(e.site||'').toUpperCase()===String(o.site||'').toUpperCase()&&String(e.material||'').toUpperCase()===String(o.material||'').toUpperCase()&&String(e.unit||'').toUpperCase()===String(o.unit||'').toUpperCase()}).reduce(function(sum,e){return sum+(parseFloat(e.qty)||0)},0)}
function qtyLeftForOrder(o){return Math.max(0,(parseFloat(o.orderQty)||0)-entryQtyForOrder(o))}
function matchingOrders(customer,site,material,unit){return (state.orders||[]).filter(function(o){return (!customer||String(o.customer)===String(customer))&&(!site||String(o.site)===String(site))&&(!material||String(o.material)===String(material))&&(!unit||String(o.unit)===String(unit))})}
function selectedOrderSummary(customer,site,material,unit){var ms=matchingOrders(customer,site,material,unit); if(!ms.length)return '<div class="orderBox" style="border-color:#dc2626;background:#fff1f2"><b>NO ACTIVE ORDER FOUND</b><p class="muted">This customer / site / material / unit does not have an active order with qty left. Entry will not save. Press Sync > Full Refresh if an order was just added.</p></div>'; return ms.map(function(o){var del=entryQtyForOrder(o), left=qtyLeftForOrder(o), low=left<=50, completed=left<=0;return '<div class="orderBox" style="'+(completed?'border-color:#dc2626;background:#fff1f2':(low?'border-color:#f59e0b;background:#fffbeb':''))+'"><b>ORDER BALANCE</b>'+(completed?'<p style="color:#991b1b;font-weight:900">ORDER COMPLETED: 0 '+esc(o.unit)+' left. No more entries allowed.</p>':(low?'<p style="color:#92400e;font-weight:900">WARNING: '+esc(left.toFixed(2))+' '+esc(o.unit)+' left. You may still capture, but not more than the qty left.</p>':''))+'<div class="orderGrid"><div><span class="muted">Ordered</span><br><b>'+esc(o.orderQty)+' '+esc(o.unit)+'</b></div><div><span class="muted">Delivered</span><br><b>'+esc(del.toFixed(2))+' '+esc(o.unit)+'</b></div><div><span class="muted">Qty Left</span><br><b>'+esc(left.toFixed(2))+' '+esc(o.unit)+'</b></div><div><span class="muted">Order</span><br><b>'+esc(o.customer)+' / '+esc(o.site)+' / '+esc(o.material)+'</b></div></div></div>'}).join('')}

function checkOrderLimitBeforeLocalSave(o,qty){
 if(!o){
   formMsg('NO ACTIVE ORDER FOUND. This customer, site, material and unit does not have an active order with qty left. Entry was not saved. Press Sync > Full Refresh if the order was just added.','error');
   return false;
 }
 // Round money/quantity style values to 2 decimals before comparing.
 // This prevents exact remaining balances from being blocked by floating point values like 19.999999.
 qty=Math.round(((parseFloat(qty)||0)+Number.EPSILON)*100)/100;
 var left=Math.round((qtyLeftForOrder(o)+Number.EPSILON)*100)/100;
 var qtyEl=document.getElementById('qty');
 if(left<=0){
   if(qtyEl)qtyEl.value='0';
   formMsg('ORDER COMPLETED / NO QTY LEFT. Entry was not saved for '+o.customer+' / '+o.site+' / '+o.material+'.','error');
   return false;
 }
 if(qty>left+0.001){
   if(qtyEl){qtyEl.value=left.toFixed(2);captureDeliveryForm();}
   formMsg('Qty is more than order balance. Entry was not saved. Maximum allowed qty is '+left.toFixed(2)+' '+o.unit+'. The qty field was changed to the allowed balance.','error');
   return false;
 }
 var projected=Math.max(0,Math.round(((left-qty)+Number.EPSILON)*100)/100);
 if(left<=50 || projected<=50){
   formMsg('WARNING: Order balance is low. Qty left after this entry will be '+projected.toFixed(2)+' '+o.unit+'. You can still save, but cannot save more than the qty left.','error');
 }
 return true;
}

       if(!r || !r.ok){q.status='Failed: '+((r&&r.message)||'No success confirmation from Google Sheets');return true}
       if(q.action==='saveDelivery'){
         var deliveryId=q.payload&&q.payload.id ? String(q.payload.id) : '';
         if(!deliveryId || !confirmedDeliveryIds[deliveryId]){
           q.status='VERIFY FAILED: Google Sheets did not confirm Delivery ID '+(deliveryId||'(missing ID)');
           return true;
         }
       }
       return false;
     });

     if(Array.isArray(res.entries))state.entries=res.entries;
     else if(Array.isArray(res.savedEntries))mergeEntriesById(res.savedEntries);
     if(res.orders)state.orders=res.orders;
     save();render();
     if(state.queue.length){
       msg('Sync not fully confirmed. Unverified/failed entries were KEPT in the queue: '+state.queue.map(function(q){return q.status}).join(' | '),'error');
     }else{
       msg('Sync complete. Every delivery was confirmed in Google Sheets before the queue was cleared.','ok');
     }
   }).catch(function(e){
     save();
     msg('Sync failed or could not be verified. Queue was NOT cleared: '+e.message,'error');
   }).finally(function(){setBusy(false)});
 });
};function getDeviceId(){var k='hfqDeliveryDeviceId';var v=localStorage.getItem(k);if(!v){v='DEV-'+uid();localStorage.setItem(k,v)}return v}

 }else{
   msg('App error: '+m,'error');
 }
