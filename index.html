<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>HFQ Delivery Capture</title><link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#075bd8;--blue2:#003a94;--cyan:#18b8ff;--green:#16a34a;--red:#dc2626;--amber:#b45309;
  --radius:18px;--shadow:0 8px 24px rgba(15,23,42,.08)
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef5ff 0,#f7f9fc 220px,#f4f7fb 100%);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:linear-gradient(180deg,#0968f0,#044fb9);color:#fff;cursor:pointer;box-shadow:0 5px 14px rgba(7,91,216,.22)}
button.secondary{background:#eef3fb;color:#075bd8;box-shadow:none;border:1px solid #d8e3f4}
button.good{background:linear-gradient(180deg,#22c55e,#159447)}
button:disabled{opacity:.55}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 86px}
.top{background:linear-gradient(160deg,#062b79 0%,#075bd8 55%,#053b98 100%);color:#fff;border-radius:0 0 28px 28px;padding:18px 16px 26px;box-shadow:0 12px 35px rgba(7,91,216,.28)}
.brand{display:flex;gap:12px;align-items:center;justify-content:center;text-align:center;flex-direction:column}
.brand img{width:86px;height:58px;object-fit:contain;background:transparent;border-radius:14px;padding:0}
.brand h1{font-size:24px;margin:0;font-weight:900}
.brand p{margin:4px 0 0;color:#dbeafe;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.12);color:#fff;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10;box-shadow:0 -6px 22px rgba(15,23,42,.08)}
.tabs button{border-radius:0;background:#fff;color:#64748b;padding:11px 4px;font-size:12px;box-shadow:none}
.tabs button.active{color:#075bd8;background:#fff;border-top:3px solid #075bd8}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{grid-column:span 12;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:19px}
@media(min-width:800px){.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
label{display:block;font-size:12px;font-weight:900;color:#334155;margin:10px 0 6px}
input,select,textarea{width:100%;border:1px solid #dbe3ef;border-radius:14px;padding:13px;background:#fff;color:#0f172a;box-shadow:0 1px 0 rgba(15,23,42,.03)}
select{appearance:auto}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(7,91,216,.18);border-color:#075bd8}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.missed{border:2px solid #dc2626!important;background:#fff5f5!important}
textarea{min-height:82px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.status{font-size:12px;font-weight:900;border-radius:999px;padding:7px 10px}
.pending{background:#fff7ed;color:var(--amber)}
.list{display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;box-shadow:0 3px 12px rgba(15,23,42,.04)}
.error{background:#fff1f2;border:1px solid #fecdd3;color:#991b1b;border-radius:16px;padding:12px;margin:12px 0;white-space:pre-wrap}
.ok{background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;border-radius:16px;padding:12px;margin:12px 0;white-space:pre-wrap}
.photoPreview img{width:130px;height:96px;object-fit:cover;border:1px solid var(--line);border-radius:16px}
.truckBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 5px 16px rgba(15,23,42,.06);position:relative}
.truckBox b{font-size:12px;text-transform:uppercase;color:#64748b}
.truckBox p{font-size:17px;font-weight:800;margin:6px 0 0}
video{width:100%;border-radius:16px;background:#000;max-height:360px}
.buttonLike{display:inline-block;border-radius:14px;padding:12px 16px;font-weight:800;background:linear-gradient(180deg,#0968f0,#044fb9);color:#fff;cursor:pointer}
.secondaryLike{background:#eef3fb;color:#075bd8;border:1px solid #d8e3f4}
.scanModal{position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:99;display:flex;align-items:center;justify-content:center;padding:14px}
.scanBox{background:#fff;border-radius:22px;padding:16px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.32)}
.scanBox h2{margin:0 0 8px}
.scanBox video{width:100%;border-radius:16px;background:#000;max-height:360px}
.quickStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat .num{font-size:24px;font-weight:900;color:#0f172a}
.stat .lbl{font-size:12px;color:#64748b;margin-top:4px}
.scanHero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.scanIcon{font-size:44px;color:#075bd8;margin:8px 0}
</style>
</head><body>
<div class="top"><div class="brand"><img src="icons/hfq-logo.png" onerror="this.style.display='none'"><div><h1>Delivery Capture</h1><p>Scan. Capture. Deliver.</p></div></div><div class="bar"><span class="pill">User Mode</span><span class="pill">Offline ready</span><span class="pill">SA Time</span></div></div>
<div class="wrap"><div id="msg"></div><main id="view"></main></div><nav class="tabs"><button id="tabAdd" onclick="show('add')">Add</button><button id="tabEntries" onclick="show('entries')">Entries</button><button id="tabSync" onclick="show('sync')">Sync</button></nav>
<script>
(function(){'use strict';
var HARD_CODED_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxm2BBf8L1jkU-moYJsg8UzH8H9KuqFzi7FEZkn6zUJdkQGLdd3PonYis3kaGq4gy8Q/exec',busy=false,scannerStream=null;
var state={tab:'add',customers:[],materials:[],sections:[],sites:[],trucks:[],entries:[],queue:[],currentTruck:null,photoData:'',lastForm:{site:'',customer:'',material:'',unit:'',section:''}};
function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function nowSA(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Africa/Johannesburg',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()).replace(' ','T')}function uid(){return 'DEL-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}function save(){localStorage.setItem('hfqDeliveryStateV1',JSON.stringify(state))}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('hfqDeliveryStateV1')||'{}'))}catch(e){}}function msg(t,cls){$('msg').innerHTML=t?'<div class="'+(cls||'ok')+'">'+esc(t)+'</div>':''}
function formMsg(t,cls){
 var el=document.getElementById('formMsg');
 if(el) el.innerHTML=t?'<div class="'+(cls||'ok')+'">'+esc(t)+'</div>':'';
 else msg(t,cls);
}
function captureDeliveryForm(){
 state.draft=state.draft||{};
 var ids=['site','customer','material','qty','unit','section','notes'];
 ids.forEach(function(id){var el=document.getElementById(id); if(el) state.draft[id]=el.value;});
 return state.draft;
}
function restoreDraftVal(id, fallback){
 return (state.draft && state.draft[id] != null) ? state.draft[id] : (fallback || '');
}
function markMissed(ids){
 var missing=[];
 ids.forEach(function(id){
   var el=document.getElementById(id);
   if(el){
     var bad=!String(el.value||'').trim();
     el.classList.toggle('missed',bad);
     if(bad)missing.push(id);
     el.oninput=function(){el.classList.remove('missed');captureDeliveryForm();};
     el.onchange=function(){el.classList.remove('missed');captureDeliveryForm();};
   }
 });
 return missing;
}
function bindDraftEvents(){
 ['site','customer','material','qty','unit','section','notes'].forEach(function(id){
   var el=document.getElementById(id);
   if(el){
     el.oninput=function(){el.classList.remove('missed');captureDeliveryForm();};
     el.onchange=function(){el.classList.remove('missed');captureDeliveryForm();};
   }
 });
}
function setBusy(on,label){
 busy=!!on;
 Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){b.disabled=busy});
 var sb=document.getElementById('saveDeliveryBtn');
 if(sb)sb.textContent=busy?'Saving...':'Save Entry / Queue';
 if(label)msg(label,'ok');
}function markMissed(ids){var miss=[];ids.forEach(function(id){var el=$(id);if(el){var bad=!String(el.value||'').trim();el.classList.toggle('missed',bad);if(bad)miss.push(id);el.oninput=function(){el.classList.remove('missed')};el.onchange=function(){el.classList.remove('missed')}}});return miss}function options(arr,val,ph){return '<option value="">'+esc(ph||'Select')+'</option>'+arr.map(function(x){return '<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>'}).join('')}
window.show=function(tab){stopScanner();state.tab=tab;msg('');render()};function setTabs(){['Add','Entries','Sync'].forEach(function(x){var b=$('tab'+x);if(b)b.className=state.tab.toLowerCase()===x.toLowerCase()?'active':''})}function render(){setTabs(); if(state.tab==='add')renderAdd(); if(state.tab==='entries')renderEntries(); if(state.tab==='sync')renderSync();}
function renderAdd(){var truck=state.currentTruck||{};var last=state.lastForm||{};$('view').innerHTML='<div class="grid"><section class="card"><h2>Add Entry</h2><div class="scanHero"><div style="font-weight:900;color:#075bd8">SCAN TRUCK QR CODE</div><p class="muted">Scan the truck QR to begin</p><div class="scanIcon">▣</div><button onclick="openScanModal()">SCAN QR</button></div><div class="row" style="display:none"><button class="secondary" onclick="openScanModal()">Scan QR</button></div><div class="truckBox"><b>Truck</b><p>'+(truck.plantNumber?esc(truck.plantNumber)+' • '+esc(truck.truckReg)+' • '+esc(truck.company)+' '+(isExpiredTruck(truck)?' • EXPIRED ONCE':''):'No truck selected')+'</p></div><div class="two"><div><label>Site</label><select id="site">'+options(state.sites,last.site||'','Select site')+'</select></div><div><label>Customer</label><select id="customer">'+options(state.customers,last.customer||'','Select customer')+'</select></div><div><label>Material</label><select id="material">'+options(state.materials,last.material||'','Select material')+'</select></div><div><label>Qty Material</label><input id="qty" type="number" step="0.01" min="0" value="'+esc(restoreDraftVal('qty'))+'"></div><div><label>Unit</label><select id="unit"><option value="">Select unit</option><option '+((last.unit||'')==='Tons'?'selected':'')+'>Tons</option><option '+((last.unit||'')==='m³'?'selected':'')+'>m³</option></select></div><div><label>Section Delivered To</label><select id="section">'+options(state.sections,last.section||'','Select section')+'</select></div></div><label>Notes</label><textarea id="notes">'+esc(restoreDraftVal('notes'))+'</textarea></section><section class="card"><h2>Delivery Photo</h2><div class="row"><label style="margin:0"><span class="buttonLike">Take Photo</span><input id="photoCamera" type="file" accept="image/*" capture="environment" style="display:none"></label><label style="margin:0"><span class="buttonLike secondaryLike">Add File</span><input id="photoFile" type="file" accept="image/*" style="display:none"></label></div><div class="photoPreview">'+(state.photoData?'<img src="'+state.photoData+'">':'')+'</div></section><section class="card"><div id="formMsg"></div><button id="saveDeliveryBtn" class="good" onclick="saveDelivery()">Save Entry / Queue</button></section></div>';function bindPhotoInput(id){
 var pi=$(id);
 if(!pi)return;
 pi.onchange=function(){
   var f=pi.files&&pi.files[0];
   if(!f)return;
   var r=new FileReader();
   r.onload=function(){state.photoData=r.result;save();renderAdd()};
   r.readAsDataURL(f);
 };
}
bindPhotoInput('photoCamera');
bindPhotoInput('photoFile');
}
window.manualQr=function(){var v=prompt('Enter QR value from truck sticker'); if(v)handleQr(v)};function parseQr(v){var parts=String(v||'').split('|');return (parts.length>=3&&parts[0].toUpperCase()==='TRUCK')?{qrValue:v,plantNumber:parts[1],truckReg:parts[2]}:{qrValue:v,plantNumber:v,truckReg:''}}function findTruck(qr){var p=parseQr(qr);return state.trucks.find(function(t){return String(t.qrValue)===String(qr)||String(t.plantNumber)===String(p.plantNumber)||String(t.truckReg).toUpperCase()===String(p.truckReg).toUpperCase()})||null}
function truckKey(t){return String((t&&t.plantNumber)||'')+'|'+String((t&&t.truckReg)||'')}
function isExpiredTruck(t){
 if(!t)return false;
 if(String(t.status||'').toUpperCase()==='EXPIRED')return true;
 if(!t.licenseExpiry)return false;
 var today=new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Johannesburg'}));today.setHours(0,0,0,0);
 var exp=new Date(String(t.licenseExpiry)+'T00:00:00');
 return exp < today;
}
function isApprovedTruck(t){return String((t&&t.approvalStatus)||'').toLowerCase()==='approved'}
function expiredOnceUsed(t){
 var used=JSON.parse(localStorage.getItem('hfqExpiredTruckOnceV1')||'{}');
 return !!used[truckKey(t)];
}
function markExpiredOnceUsed(t){
 var used=JSON.parse(localStorage.getItem('hfqExpiredTruckOnceV1')||'{}');
 used[truckKey(t)]=nowSA();
 localStorage.setItem('hfqExpiredTruckOnceV1',JSON.stringify(used));
}
function handleQr(qr){
 var t=findTruck(qr);
 closeScanModal();

 if(!t){
   msg('Truck not found in Google Sheets Truck Register master. Download Masters first or contact admin.','error');
   return;
 }

 if(!isApprovedTruck(t)){
   state.currentTruck=null;save();
   msg('Truck rejected: vehicle is not approved in Truck Register.','error');
   show('add');
   return;
 }

 if(isExpiredTruck(t)){
   if(expiredOnceUsed(t)){
     state.currentTruck=null;save();
     msg('Truck rejected: vehicle license is expired and the one-time expired vehicle allowance was already used.','error');
     show('add');
     return;
   }
   markExpiredOnceUsed(t);
   t.expiredOneTimeAccepted=true;
   state.currentTruck=t;save();
   msg('WARNING: Vehicle is expired. This vehicle is accepted ONCE only for this device. It will be rejected after this scan.','error');
   show('add');
   return;
 }

 state.currentTruck=t;save();
 msg('Truck accepted: '+(t.plantNumber||'')+' '+(t.truckReg||''),'ok');
 show('add');
}
window.saveDelivery=function(){if(busy)return;var truck=state.currentTruck;if(!truck||!truck.plantNumber){formMsg('Scan/select truck QR first. Entry was not saved.','error');return}if(!isApprovedTruck(truck)){msg('Truck rejected: vehicle is not approved.','error');return}if(isExpiredTruck(truck)&&!truck.expiredOneTimeAccepted){msg('Truck rejected: vehicle is expired.','error');return}captureDeliveryForm();var miss=markMissed(['site','customer','material','qty','unit','section']);if(miss.length){formMsg('Please complete red highlighted fields. Entry was not saved.','error');return}if(!state.photoData){formMsg('Delivery photo is required. Entry was not saved.','error');return}setBusy(true);try{var rec={id:uid(),serialNo:'',plantNumber:truck.plantNumber||'',truckReg:truck.truckReg||'',company:truck.company||'',site:$('site').value,customer:$('customer').value,material:$('material').value,qty:$('qty').value,unit:$('unit').value,section:$('section').value,photoData:state.photoData,photoUrl:'',photoFileName:'',createdAt:nowSA(),updatedAt:nowSA(),deviceId:getDeviceId(),qrValue:truck.qrValue||'',notes:$('notes').value.trim()};state.entries.unshift(rec);state.queue.push({id:uid(),action:'saveDelivery',payload:rec,createdAt:nowSA(),status:'Queued'});state.lastForm={site:rec.site,customer:rec.customer,material:rec.material,unit:rec.unit,section:rec.section};state.draft={site:rec.site,customer:rec.customer,material:rec.material,unit:rec.unit,section:rec.section,notes:rec.notes,qty:''};state.photoData='';save();msg('Delivery saved locally and queued for sync.','ok');show('entries')}finally{setBusy(false)}}
function renderEntries(){var list=(state.entries||[]).map(function(e){return '<div class="item"><div class="row"><b>'+esc(e.serialNo||'Pending serial')+'</b><span class="status pending">'+esc(e.unit||'')+'</span></div><p>'+esc(e.plantNumber)+' • '+esc(e.truckReg)+' • '+esc(e.customer)+'</p><p class="muted">'+esc(e.material)+' • '+esc(e.qty)+' '+esc(e.unit)+' • '+esc(e.site)+' • '+esc(e.section)+'</p>'+(e.photoUrl?'<p><a href="'+esc(e.photoUrl)+'" target="_blank">Open photo</a></p>':'')+'</div>'}).join('')||'<div class="card"><p>No entries yet.</p></div>';$('view').innerHTML='<div class="grid"><section class="card"><h2>Entries</h2><div class="list">'+list+'</div></section></div>'}
function renderSync(){$('view').innerHTML='<div class="grid"><section class="card"><h2>Sync</h2><p class="muted">Google Sheets is master. Trucks download from external Truck Register master. Download masters first before capture.</p><div class="quickStats"><div class="stat"><div class="num">'+state.entries.length+'</div><div class="lbl">Entries</div></div><div class="stat"><div class="num">'+state.queue.length+'</div><div class="lbl">Pending</div></div><div class="stat"><div class="num">'+Math.max(0,state.entries.length-state.queue.length)+'</div><div class="lbl">Synced</div></div></div><div class="row"><button class="secondary" onclick="downloadMasters()">Download Masters</button><button class="good" onclick="syncNow()">Sync Queue</button></div><p class="muted">Queue entries: '+state.queue.length+'</p></section><section class="card"><h2>Queue</h2><div class="list">'+(state.queue.map(function(q){return '<div class="item"><b>'+esc(q.action)+'</b><p class="muted">'+esc(q.createdAt)+' • '+esc(q.status)+'</p></div>'}).join('')||'<p>No queue entries.</p>')+'</div></section></div>'}


window.openScanModal=function(){
 stopScanner();
 var div=document.createElement('div');
 div.className='scanModal';
 div.id='scanModal';
 div.innerHTML='<div class="scanBox"><div class="row"><h2 style="flex:1">Scan Truck QR</h2><button class="secondary" onclick="closeScanModal()">Close</button></div><p class="muted">Point camera at approved truck QR code.</p><video id="video" playsinline></video><canvas id="scanCanvas" style="display:none"></canvas><div class="row" style="margin-top:10px"><button onclick="startScanner()">Start Camera</button></div></div>';
 document.body.appendChild(div);
 setTimeout(function(){startScanner()},100);
}
window.closeScanModal=function(){
 stopScanner();
 var m=document.getElementById('scanModal');
 if(m)m.remove();
}
window.startScanner=function(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Camera not available on this device/browser.','error');return}navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){scannerStream=stream;var v=$('video');v.srcObject=stream;v.play();scanLoop()}).catch(function(e){msg('Camera permission denied. '+e.message,'error')})};function stopScanner(){if(scannerStream){scannerStream.getTracks().forEach(function(t){t.stop()});scannerStream=null}}function scanLoop(){var v=$('video'),c=$('scanCanvas');if(!scannerStream||!v||!c)return;if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);try{if('BarcodeDetector' in window){var d=new BarcodeDetector({formats:['qr_code']});d.detect(c).then(function(codes){if(codes&&codes.length){stopScanner();handleQr(codes[0].rawValue)}else setTimeout(scanLoop,350)}).catch(function(){setTimeout(scanLoop,350)});return}}catch(e){}}setTimeout(scanLoop,350)}
function api(data){return fetch(HARD_CODED_SCRIPT_URL,{method:'POST',body:JSON.stringify(data)}).then(function(r){return r.text()}).then(function(t){try{return JSON.parse(t)}catch(e){throw new Error(t)}})}window.downloadMasters=function(){if(busy)return;setBusy(true,'Downloading masters...');api({action:'getMasters'}).then(function(res){if(!res.ok)throw new Error(res.error||'Download failed');state.customers=res.customers||[];state.materials=res.materials||[];state.sections=res.sections||[];state.sites=res.sites||[];state.trucks=res.trucks||[];state.entries=res.entries||state.entries||[];save();msg('Masters downloaded, including Truck Register from external master sheet.','ok');render()}).catch(function(e){msg('Download failed: '+e.message,'error')}).finally(function(){setBusy(false)})};window.syncNow=function(){if(busy)return;if(!state.queue.length){msg('Nothing to sync.','ok');return}setBusy(true,'Syncing queue...');api({action:'syncQueue',queue:state.queue.slice()}).then(function(res){if(!res.ok)throw new Error(res.error||'Sync failed');state.queue=[];if(res.entries)state.entries=res.entries;save();msg('Sync complete.','ok');render()}).catch(function(e){msg('Sync failed: '+e.message,'error')}).finally(function(){setBusy(false)})};function getDeviceId(){var k='hfqDeliveryDeviceId';var v=localStorage.getItem(k);if(!v){v='DEV-'+uid();localStorage.setItem(k,v)}return v}
window.addEventListener('error',function(e){msg('App error: '+e.message,'error')});load();render();if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js?v=7').catch(function(){})}})();
</script></body></html>
